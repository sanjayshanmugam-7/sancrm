<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="SanCRM – Smart Customer Relationship Management" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>SanCRM</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; }
      /* Loading spinner shown before React mounts */
      #initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #f4f6f8; z-index: 9999;
      }
      #initial-loader .spinner {
        width: 48px; height: 48px;
        border: 4px solid #e3e8ef;
        border-top-color: #1976d2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      #initial-loader p { color: #637381; font-size: 14px; font-weight: 500; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run SanCRM.</noscript>
    <div id="initial-loader">
      <div class="spinner"></div>
      <p>Loading SanCRM...</p>
    </div>
    <div id="root"></div>
    <script>
      // Remove loader once React renders
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';
        }, 300);
      });
    </script>
  </body>
</html>
